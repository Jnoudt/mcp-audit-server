name: Deploy ReconFlow Static Web App

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/swa-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconflow-swa-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint, type-check, and build frontend
        run: |
          npm run lint
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.RECONFLOW_API_BASE_URL || 'https://reconflow-api-ep8odn.azurewebsites.net' }}

      - name: Deploy prebuilt frontend to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          api_location: ""
          output_location: ""
          skip_app_build: true
